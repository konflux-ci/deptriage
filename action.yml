---
name: "Dependency Impact Analysis"
description: "Classify dependency PRs, gather deterministic inspection evidence, and enforce merge policy"
author: "konflux-infra"

inputs:
  command:
    description: "Command to run: classify, analyze, both, or merge"
    required: true
    default: "both"
  pr-number:
    description: "Pull request number (not required for merge command with head-sha)"
    required: false
    default: "0"
  github-token:
    description: "GitHub token for API operations"
    required: true
    default: ${{ github.token }}
  api-key:
    description: "Deprecated and ignored; retained for compatibility"
    required: false
  llm-provider:
    description: "Deprecated and ignored; retained for compatibility"
    required: false
    default: "gemini"
  llm-model:
    description: "Deprecated and ignored; retained for compatibility"
    required: false
  context-output:
    description: "Path for the deterministic inspection report (defaults to $GITHUB_WORKSPACE/deptriage-context.json)"
    required: false
  auto-approve:
    description: "Apply approved/lgtm labels for deterministic eligible patches, minors, and digests"
    required: false
    default: "false"
  auto-merge:
    description: "Deprecated and ignored; merge is performed only by the merge command"
    required: false
    default: "false"
  dry-run:
    description: "Suppress all GitHub API writes; log what would happen instead"
    required: false
    default: "false"
  head-sha:
    description: "Head SHA to find PRs for; deferred merge checks and merge are bound to this SHA"
    required: false
  trusted-bots:
    description: "Comma-separated additional trusted bot logins for classification and deferred merge validation (added to defaults: renovate[bot], red-hat-konflux[bot], dependabot[bot])"
    required: false
  suspicious-paths:
    description: "Comma-separated additional suspicious path prefixes for classification and deferred merge validation (added to defaults: .claude/, .vscode/, .github/workflows/, .github/actions/)"
    required: false
  expected-files:
    description: "Comma-separated additional expected file patterns for classification and deferred merge scope validation (added to defaults: go.mod, go.sum, vendor/, .tekton/, etc.)"
    required: false

outputs:
  bump-type:
    description: "Detected semver bump type (major/minor/patch/digest/unknown)"
  risk-level:
    description: "Always unknown; retained for compatibility after LLM analysis removal"
  context-json:
    description: "Path to the deterministic inspection report JSON"

runs:
  using: "docker"
  image: "docker://quay.io/konflux-ci/deptriage@sha256:60c91518f9d2625c28495e60c4a2bc29933d8748d30cb45f1f643e2fc79edb8d"
  args:
    - ${{ inputs.command }}
  env:
    INPUT_PR_NUMBER: ${{ inputs.pr-number }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    INPUT_API_KEY: ${{ inputs.api-key }}
    INPUT_LLM_PROVIDER: ${{ inputs.llm-provider }}
    INPUT_LLM_MODEL: ${{ inputs.llm-model }}
    INPUT_CONTEXT_OUTPUT: ${{ inputs.context-output }}
    INPUT_AUTO_APPROVE: ${{ inputs.auto-approve }}
    INPUT_AUTO_MERGE: ${{ inputs.auto-merge }}
    INPUT_DRY_RUN: ${{ inputs.dry-run }}
    INPUT_HEAD_SHA: ${{ inputs.head-sha }}
    INPUT_TRUSTED_BOTS: ${{ inputs.trusted-bots }}
    INPUT_SUSPICIOUS_PATHS: ${{ inputs.suspicious-paths }}
    INPUT_EXPECTED_FILES: ${{ inputs.expected-files }}

branding:
  icon: "shield"
  color: "blue"
